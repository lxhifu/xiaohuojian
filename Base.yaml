# ========== DNS 设定 ==========
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.apple.com"
    - "ntp.*.com"
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    geosite:geolocation-!cn:
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query

# ========== 节点定义 (留空，等待 worker 动态注入) ==========
proxies: []

# ========== 策略组 ==========
proxy-groups:
  - type: select
    name: 🚀 节点选择
    proxies:
      - ⚡ 自动选择
      - DIRECT
      - REJECT
      # Worker 会自动在此处下方插入所有抓取到的节点名称
      
  - name: ⚡ 自动选择
    type: url-test
    proxies:
      # Worker 会自动在此处注入节点
    url: https://www.gstatic.com/generate_204
    interval: 600
    lazy: false
    
  - type: select
    name: 🛑 广告拦截
    proxies:
      - REJECT
      - DIRECT
      - 🚀 节点选择
      
  - type: select
    name: 💬 AI 服务
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: 📹 油管视频
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: 🔍 谷歌服务
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: 🔒 国内服务
    proxies:
      - DIRECT
      - 🚀 节点选择
      
  - type: select
    name: 📲 电报消息
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: 🌐 社交媒体
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: 💰︎数字币
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: 🌎非国内
    proxies:
      - 🚀 节点选择
      
  - type: select
    name: ☎Talkatone
    proxies:
      - 🚀 节点选择
      - DIRECT
      
  - type: select
    name: 🏠 私人网络
    proxies:
      - DIRECT
      - 🚀 节点选择
      
  - type: select
    name: 🎬Emby
    proxies:
      - 🚀 节点选择
      - DIRECT
      
  - type: select
    name: 🐟漏网之鱼
    proxies:
      - 🚀 节点选择
      - DIRECT

# ========== 路由规则 ==========
rules:
  - IP-CIDR,192.168.100.0/24,🏠 私人网络,no-resolve
  - DOMAIN-SUFFIX,polymarket.com,🚀 节点选择
  - DOMAIN-SUFFIX,69yun69.com,🎬Emby
  - RULE-SET,shuzibi_list,💰︎数字币
  - RULE-SET,apple_list,🔒 国内服务
  - RULE-SET,ad_list,🛑 广告拦截
  - RULE-SET,openai_list,💬 AI 服务
  - RULE-SET,telegram_list,📲 电报消息
  - RULE-SET,youtube_list,📹 油管视频
  - RULE-SET,google_list,🔍 谷歌服务
  - RULE-SET,talkatone_list,☎Talkatone
  - RULE-SET,china_list,🔒 国内服务
  - RULE-SET,shejiaomeiti_list,🌐 社交媒体
